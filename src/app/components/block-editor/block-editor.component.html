<div class="flex flex-col gap-6">
  <div class="editor-toolbar flex flex-wrap items-center gap-2 rounded-lg border border-neutral-200 bg-white/70 p-2 backdrop-blur">
    <button type="button" class="toolbar-btn font-semibold" (click)="toggleFormat('bold')">B</button>
    <button type="button" class="toolbar-btn italic" (click)="toggleFormat('italic')">I</button>
    <button type="button" class="toolbar-btn underline" (click)="toggleFormat('underline')">U</button>
    <button type="button" class="toolbar-btn line-through" (click)="toggleFormat('strikeThrough')">S</button>
    <button type="button" class="toolbar-btn" (click)="toggleFormat('insertUnorderedList')">• List</button>
    <button type="button" class="toolbar-btn" (click)="toggleFormat('insertOrderedList')">1. List</button>
    <button type="button" class="toolbar-btn" (click)="toggleFormat('formatBlock', 'blockquote')">❝ Quote</button>
    <button type="button" class="toolbar-btn" (click)="toggleFormat('createLink')">🔗 Link</button>
    <span class="ml-auto text-xs text-neutral-500">Type “/” for commands</span>
  </div>

  <div class="flex flex-col gap-3">
    <div
      class="block-row relative flex items-stretch gap-3 rounded-lg border border-transparent bg-white/70 px-3 py-2 transition hover:border-neutral-200 hover:bg-white/95"
      *ngFor="let block of blocks; trackBy: trackBlock"
      draggable="true"
      (dragstart)="onDragStart($event, block)"
      (dragover)="onDragOver($event, block)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event, block)"
    >
      <div class="flex flex-col items-center gap-2 pt-1">
        <button
          type="button"
          class="opacity-0 transition hover-controls text-neutral-400 hover:text-neutral-700"
          title="Drag to reorder"
        >
          ☰
        </button>
        <select
          class="hidden md:block rounded-md border border-neutral-200 bg-neutral-50 px-1 py-0.5 text-xs text-neutral-500 focus:border-neutral-400 focus:outline-none"
          [(ngModel)]="block.type"
          (ngModelChange)="transformBlock(block, $event)"
        >
          <option *ngFor="let option of typeOptions" [ngValue]="option.value">{{ option.label }}</option>
        </select>
        <button
          type="button"
          class="opacity-0 transition hover-controls text-neutral-300 hover:text-red-500"
          title="Delete block"
          (click)="removeBlock(block)"
        >
          ✕
        </button>
      </div>

      <ng-container [ngSwitch]="block.type">
        <div *ngSwitchCase="'todo'" class="flex flex-1 items-center gap-3 rounded-md bg-white px-3 py-2 shadow-sm">
          <input
            type="checkbox"
            class="h-5 w-5 rounded border-neutral-300 text-sky-500 focus:ring-sky-500"
            [checked]="block.checked"
            (change)="handleCheckboxChange(block, $any($event.target).checked)"
          />
          <div
            #blockContent
            class="flex-1 min-h-[24px] outline-none text-base text-neutral-700"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <div
          *ngSwitchCase="'code'"
          class="w-full rounded-xl border border-neutral-200 bg-neutral-950/95 p-4 text-sm text-neutral-100 shadow-inner"
        >
          <textarea
            class="h-32 w-full resize-y bg-transparent font-mono text-sm text-neutral-100 outline-none"
            [value]="block.code"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></textarea>
          <div class="mt-2 flex items-center justify-between text-xs text-neutral-400">
            <span>{{ block.language || 'plaintext' }}</span>
            <button type="button" class="rounded border border-neutral-700 px-2 py-1" (click)="transformBlock(block, 'paragraph')">
              Text block
            </button>
          </div>
        </div>

        <div *ngSwitchCase="'divider'" class="flex-1 self-center">
          <div class="h-px w-full bg-gradient-to-r from-transparent via-neutral-300 to-transparent"></div>
        </div>

        <div
          *ngSwitchCase="'image'"
          class="flex-1 space-y-3 rounded-xl border border-neutral-200 bg-white p-4 shadow-sm"
        >
          <ng-container *ngIf="block.url; else uploadPlaceholder">
            <img [src]="block.url" class="max-h-96 w-full rounded-lg object-cover" alt="Uploaded image" />
          </ng-container>
          <ng-template #uploadPlaceholder>
            <div class="flex h-48 w-full items-center justify-center rounded-lg border border-dashed border-neutral-300 text-neutral-400">
              Paste an image URL
            </div>
          </ng-template>
          <input
            class="w-full rounded-md border border-neutral-200 px-3 py-2 text-sm text-neutral-600 focus:border-sky-400 focus:outline-none"
            placeholder="https://example.com/image.jpg"
            [value]="block.url"
            (input)="handleInput($event, block)"
          />
          <input
            class="w-full rounded-md border border-neutral-200 px-3 py-2 text-xs text-neutral-500 focus:border-sky-400 focus:outline-none"
            placeholder="Write a caption..."
            [value]="block.caption"
            (input)="handleCaptionInput($event, block)"
          />
        </div>

        <div
          *ngSwitchCase="'bookmark'"
          class="flex-1 rounded-xl border border-neutral-200 bg-white px-4 py-3 shadow-sm"
        >
          <div class="mb-2 text-xs uppercase tracking-wide text-neutral-400">Bookmark</div>
          <input
            class="w-full rounded-md border border-neutral-200 px-3 py-2 text-sm text-neutral-600 focus:border-sky-400 focus:outline-none"
            placeholder="Paste a link to preview"
            [value]="block.url"
            (input)="handleInput($event, block)"
          />
          <div class="mt-3 rounded-lg bg-neutral-50 p-3 text-xs text-neutral-500">
            Link previews will appear here after backend integration.
          </div>
        </div>

        <div
          *ngSwitchCase="'quote'"
          class="relative flex-1 rounded-xl border border-neutral-200 bg-white/80 px-5 py-4 shadow-sm"
        >
          <div class="absolute left-3 top-3 text-3xl text-neutral-300">❝</div>
          <div
            #blockContent
            class="min-h-[28px] text-lg italic text-neutral-700 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <div
          *ngSwitchCase="'callout-info'; else calloutOther"
          class="flex flex-1 items-start gap-3 rounded-xl px-4 py-3"
          [ngClass]="calloutTone(block).className"
        >
          <div class="pt-1 text-lg">{{ calloutTone(block).icon }}</div>
          <div
            #blockContent
            class="min-h-[28px] flex-1 text-neutral-800 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <ng-template #calloutOther>
          <div
            class="flex flex-1 items-start gap-3 rounded-xl px-4 py-3"
            [ngClass]="calloutTone(block).className"
          >
            <div class="pt-1 text-lg">{{ calloutTone(block).icon }}</div>
            <div
              #blockContent
              class="min-h-[28px] flex-1 text-neutral-800 outline-none"
              contenteditable="true"
              [attr.data-block-id]="block.id"
              [innerHTML]="block.html"
              (focus)="handleBlockFocus(block)"
              (input)="handleInput($event, block)"
              (keydown)="onKeyDown($event, block)"
            ></div>
          </div>
        </ng-template>

        <div *ngSwitchCase="'heading-1'" class="flex-1">
          <div
            #blockContent
            class="min-h-[40px] text-3xl font-semibold tracking-tight text-neutral-900 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <div *ngSwitchCase="'heading-2'" class="flex-1">
          <div
            #blockContent
            class="min-h-[36px] text-2xl font-semibold text-neutral-900 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <div *ngSwitchCase="'heading-3'" class="flex-1">
          <div
            #blockContent
            class="min-h-[32px] text-xl font-semibold text-neutral-900 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <div *ngSwitchCase="'bulleted-list'" class="relative flex-1 pl-6">
          <div class="absolute left-0 top-2 text-lg text-neutral-400">•</div>
          <div
            #blockContent
            class="min-h-[24px] text-base text-neutral-700 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <div *ngSwitchCase="'numbered-list'" class="relative flex-1 pl-6">
          <div class="absolute left-0 top-2 text-sm font-medium text-neutral-400">{{ getNumberIndex(block) }}.</div>
          <div
            #blockContent
            class="min-h-[24px] text-base text-neutral-700 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>

        <app-database-block
          *ngSwitchCase="'database'"
          [block]="block"
          [noteId]="noteId"
          (viewChange)="onDatabaseViewChange(block, $event)"
          (mutate)="onDatabaseMutated()"
        ></app-database-block>
        <div *ngSwitchDefault class="flex-1">
          <div
            #blockContent
            class="min-h-[28px] text-base leading-relaxed text-neutral-800 outline-none"
            contenteditable="true"
            [attr.data-block-id]="block.id"
            [innerHTML]="block.html"
            (focus)="handleBlockFocus(block)"
            (input)="handleInput($event, block)"
            (keydown)="onKeyDown($event, block)"
          ></div>
        </div>
      </ng-container>
    </div>
  </div>

  <div
    *ngIf="slashOpen"
    class="fixed z-50 w-64 rounded-xl border border-neutral-200 bg-white/98 p-2 shadow-xl"
    [ngStyle]="{ left: slashX + 'px', top: slashY + 'px' }"
  >
    <input
      class="mb-2 w-full rounded-md border border-neutral-200 px-2 py-1 text-sm text-neutral-600 focus:border-sky-400 focus:outline-none"
      placeholder="Filter blocks..."
      [(ngModel)]="slashQuery"
    />
    <div class="max-h-64 overflow-y-auto">
      <button
        *ngFor="let cmd of filteredSlashCommands"
        type="button"
        class="flex w-full items-start gap-3 rounded-lg px-2 py-1.5 text-left text-sm transition hover:bg-sky-50"
        (click)="pickSlash(cmd)"
      >
        <span class="text-lg">{{ cmd.icon }}</span>
        <span>
          <span class="block font-medium text-neutral-800">{{ cmd.label }}</span>
          <span class="block text-xs text-neutral-400">{{ cmd.description }}</span>
        </span>
      </button>
      <div *ngIf="filteredSlashCommands.length === 0" class="px-2 py-3 text-xs text-neutral-400">
        No blocks match “{{ slashQuery }}”.
      </div>
    </div>
  </div>
</div>
